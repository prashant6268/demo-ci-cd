<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up Page</title>
</head>
<body style="margin:0; padding:0; font-family:Arial, sans-serif; background:#f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh;">

<div style="background:#fff; padding:30px; width:350px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.2);">

    <h2 style="text-align:center; color:#333; margin-bottom:20px;">
        Create Account
    </h2>

    <form>
        <label style="display:block; margin-bottom:5px; color:#555;">
            Full Name
        </label>
        <input type="text" placeholder="Enter your name"
            style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

        <label style="display:block; margin-bottom:5px; color:#555;">
            Email
        </label>
        <input type="email" placeholder="Enter your email"
            style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

        <label style="display:block; margin-bottom:5px; color:#555;">
            Password
        </label>
        <input type="password" placeholder="Enter password"
            style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

        <label style="display:block; margin-bottom:5px; color:#555;">
            Confirm Password
        </label>
        <input type="password" placeholder="Confirm password"
            style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

        <button type="submit"
            style="width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px;">
            Sign Up
        </button>
    </form>

    <p style="text-align:center; margin-top:15px; color:#666;">
        Already have an account?
        <a href="#" style="color:#007bff; text-decoration:none;">Login</a>
    </p>

</div>

</body>
</html>

</body>
</html>
